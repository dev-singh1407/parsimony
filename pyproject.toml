[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parsimony"
version = "0.1.0"
description = "Token-efficient LLM interaction on CPU-only hardware"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "tokenizers>=0.15",
    "typer>=0.9",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
# Sprint 2+. Deliberately not installed yet — see docs/03-decision-log.md ADR-007.
models = ["httpx>=0.27", "sentence-transformers>=2.2", "spacy>=3.7"]

[project.scripts]
parsimony = "parsimony.surfaces.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The visualiser's page, stylesheet and script ship with the code that serves
# them. It was one self-contained file until the page grew a scrubbable pipeline
# view and stopped being reviewable; splitting it meant an installed copy served
# markup with no styles and no behaviour, because only *.html was declared here.
# `test_web.py` now asserts that everything web.py can serve is listed.
"parsimony.surfaces" = ["*.html", "*.css", "*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
