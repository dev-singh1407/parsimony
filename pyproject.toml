[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parsimony"
version = "0.1.0"
description = "Token-efficient LLM interaction on CPU-only hardware"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "tokenizers>=0.15",
    "typer>=0.9",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
# Sprint 2+. Deliberately not installed yet — see docs/03-decision-log.md ADR-007.
models = ["httpx>=0.27", "sentence-transformers>=2.2", "spacy>=3.7"]

[project.scripts]
parsimony = "parsimony.surfaces.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
