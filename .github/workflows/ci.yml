name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      # Runs first and separately: a layering violation should be reported as an
      # architecture failure, not buried among unit tests. It needs no network.
      - name: Architecture contracts
        run: pytest tests/test_architecture.py -q

      - name: Test suite
        run: pytest -q

      # reproduce.py must keep working, or the results in the report stop being
      # regenerable and the ADR-014 schema tripwire never fires.
      - name: Results reproduce end to end
        run: python reproduce.py --out /tmp/figures --no-quality

      - name: Report is non-empty
        run: test -s /tmp/figures/report.md
